<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tonton Sekarang</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red: #FF2D2D;
      --dark: #0A0A0A;
      --mid: #141414;
      --light: #F0EDE8;
      --muted: #888;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--dark);
      color: var(--light);
      font-family: 'DM Sans', sans-serif;
      overflow: hidden;
    }

    /* ───── LANDING PAGE ───── */
    #landing {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      z-index: 10;
      transition: opacity .6s ease, transform .6s ease;
    }

    /* animated noise grain */
    #landing::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.08'/%3E%3C/svg%3E");
      background-size: 200px;
      opacity: .5;
      pointer-events: none;
    }

    /* diagonal red slash accent */
    #landing::after {
      content: '';
      position: absolute;
      top: -80px; right: -80px;
      width: 340px; height: 340px;
      background: var(--red);
      clip-path: polygon(100% 0, 100% 100%, 0 100%);
      opacity: .12;
      pointer-events: none;
    }

    .badge {
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--red);
      border: 1px solid var(--red);
      padding: 5px 14px;
      border-radius: 2px;
      margin-bottom: 28px;
      opacity: 0;
      animation: fadeUp .7s .2s forwards;
    }

    .title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(64px, 12vw, 128px);
      line-height: .9;
      text-align: center;
      letter-spacing: .02em;
      opacity: 0;
      animation: fadeUp .7s .35s forwards;
    }

    .title span {
      color: var(--red);
      display: block;
    }

    .subtitle {
      margin-top: 20px;
      font-size: 15px;
      color: var(--muted);
      text-align: center;
      max-width: 320px;
      line-height: 1.6;
      font-weight: 300;
      opacity: 0;
      animation: fadeUp .7s .5s forwards;
    }

    /* play icon row */
    .meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 18px;
      opacity: 0;
      animation: fadeUp .7s .62s forwards;
    }

    .meta svg { width: 18px; height: 18px; fill: var(--red); }

    .meta span {
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ───── ENTER BUTTON ───── */
    .btn-enter {
      margin-top: 44px;
      position: relative;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      opacity: 0;
      animation: fadeUp .7s .78s forwards;
    }

    .btn-inner {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--red);
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: .14em;
      text-transform: uppercase;
      padding: 16px 36px;
      clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
      transition: background .2s, transform .15s;
    }

    .btn-enter:hover .btn-inner {
      background: #e01f1f;
      transform: translateY(-2px);
    }

    .btn-enter:active .btn-inner { transform: translateY(0); }

    .btn-inner svg {
      width: 18px; height: 18px;
      fill: #fff;
      transition: transform .2s;
    }
    .btn-enter:hover .btn-inner svg { transform: translateX(4px); }

    /* bottom line */
    .bottom-line {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: #333;
      letter-spacing: .1em;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeUp .7s 1s forwards;
      white-space: nowrap;
    }

    /* ───── VIDEO PAGE ───── */
    #player-page {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      background: #000;
      opacity: 0;
      pointer-events: none;
      transition: opacity .5s ease;
    }

    #player-page.visible {
      opacity: 1;
      pointer-events: all;
    }

    .player-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: var(--dark);
      border-bottom: 1px solid #1e1e1e;
      flex-shrink: 0;
    }

    .player-header .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: .06em;
      color: var(--light);
    }
    .player-header .logo span { color: var(--red); }

    .btn-back {
      display: flex;
      align-items: center;
      gap: 8px;
      background: none;
      border: 1px solid #2e2e2e;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: 8px 16px;
      cursor: pointer;
      transition: color .2s, border-color .2s;
    }
    .btn-back:hover { color: var(--light); border-color: #555; }
    .btn-back svg { width: 14px; height: 14px; fill: currentColor; }

    .video-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      background: #000;
    }

    .video-wrap iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* ───── KEYFRAMES ───── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* landing exit */
    #landing.exit {
      opacity: 0;
      transform: scale(.97);
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- ── LANDING ── -->
  <div id="landing">
    <div class="badge">▶ Video Pilihan</div>

    <h1 class="title">
      Tonton<br/><span>Sekarang</span>
    </h1>

    <p class="subtitle">Konten eksklusif siap untukmu — klik tombol di bawah untuk mulai menonton.</p>

    <div class="meta">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <span>YouTube &nbsp;·&nbsp; HD</span>
    </div>

    <button class="btn-enter" onclick="enterPlayer()">
      <div class="btn-inner">
        Masuk &amp; Tonton
        <svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
      </div>
    </button>

    <div class="bottom-line">© 2026 &nbsp;|&nbsp; Dibuat dengan HTML</div>
  </div>

  <!-- ── PLAYER ── -->
  <div id="player-page">
    <div class="player-header">
      <div class="logo">Tonton<span>Now</span></div>
      <button class="btn-back" onclick="goBack()">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        Kembali
      </button>
    </div>
    <div class="video-wrap">
      <iframe id="yt-frame"
        src=""
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    </div>
  </div>

  <script>
    const VIDEO_ID = '5Ywv26FsU2c';

    function enterPlayer() {
      document.getElementById('landing').classList.add('exit');
      const page = document.getElementById('player-page');
      // set src only when entering to avoid background load
      document.getElementById('yt-frame').src =
        `https://www.youtube.com/embed/${VIDEO_ID}?autoplay=1&rel=0`;
      setTimeout(() => page.classList.add('visible'), 300);
    }

    function goBack() {
      const page = document.getElementById('player-page');
      page.classList.remove('visible');
      // stop video
      document.getElementById('yt-frame').src = '';
      setTimeout(() => {
        document.getElementById('landing').classList.remove('exit');
      }, 400);
    }
  </script>
</body>
</html>
